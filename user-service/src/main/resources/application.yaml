user-service:
  port: 8085

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgres-users:5432/users
    username: users
    password: users123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # ?????????? 8081, ??? ??? Keycloak ??????????? ?? 8081:8080
          issuer-uri: http://keycloak:8080/realms/asset-management
          jwk-set-uri: http://keycloak:8080/realms/asset-management/protocol/openid-connect/certs

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    default-model-expand-depth: 3
    default-models-expand-depth: 3
    try-it-out-enabled: true
    filter: true
