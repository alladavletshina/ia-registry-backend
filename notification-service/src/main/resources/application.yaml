server:
  port: 8087

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://postgres-notifications:5432/notifications
    username: notifications
    password: notifications123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migration/db
    validate-on-migrate: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000


  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


  security:
    oauth2:
      resourceserver:
        jwt:
          #issuer-uri: http://keycloak:8080/realms/asset-management
          #jwk-set-uri: http://keycloak:8080/realms/asset-management/protocol/openid-connect/certs
          issuer-uri: https://api.myiam.ru/realms/asset-management
          jwk-set-uri: https://api.myiam.ru/realms/asset-management/protocol/openid-connect/certs

logging:
  level:
    org.springframework: INFO
    com.example.notificationservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    org.springframework.security: DEBUG
    org.springframework.web: TRACE

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    default-model-expand-depth: 3
    default-models-expand-depth: 3
    try-it-out-enabled: true
    filter: true
