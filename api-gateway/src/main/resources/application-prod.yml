server:
  port: 8082

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://api.myiam.ru/realms/asset-management
          jwk-set-uri: https://api.myiam.ru/realms/asset-management/protocol/openid-connect/certs

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        # Основные сервисы
        - id: asset-service
          uri: http://asset-service:8084
          predicates:
            - Path=/api/assets/**

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**

        - id: task-service
          uri: http://task-service:8086
          predicates:
            - Path=/api/tasks/**

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**

        - id: audit-service
          uri: http://audit-service:8088
          predicates:
            - Path=/api/audit/**

        - id: report-service
          uri: http://report-service:8089
          predicates:
            - Path=/api/reports/**

        # Swagger UI для всех сервисо
        - id: asset-swagger
          uri: http://asset-service:8084
          predicates:
            - Path=/asset-swagger-ui/**
          filters:
            - RewritePath=/asset-swagger-ui/(?<segment>.*), /$\{segment}

        - id: asset-api-docs
          uri: http://asset-service:8084
          predicates:
            - Path=/asset-api-docs/**
          filters:
            - RewritePath=/asset-api-docs/(?<segment>.*), /$\{segment}

        - id: user-swagger
          uri: http://user-service:8085
          predicates:
            - Path=/user-swagger-ui/**
          filters:
            - RewritePath=/user-swagger-ui/(?<segment>.*), /$\{segment}

        - id: user-api-docs
          uri: http://user-service:8085
          predicates:
            - Path=/user-api-docs/**
          filters:
            - RewritePath=/user-api-docs/(?<segment>.*), /$\{segment}

        - id: task-swagger
          uri: http://task-service:8086
          predicates:
            - Path=/task-swagger-ui/**
          filters:
            - RewritePath=/task-swagger-ui/(?<segment>.*), /$\{segment}

        - id: task-api-docs
          uri: http://task-service:8086
          predicates:
            - Path=/task-api-docs/**
          filters:
            - RewritePath=/task-api-docs/(?<segment>.*), /$\{segment}

        - id: notification-swagger
          uri: http://notification-service:8087
          predicates:
            - Path=/notification-swagger-ui/**
          filters:
            - RewritePath=/notification-swagger-ui/(?<segment>.*), /$\{segment}

        - id: notification-api-docs
          uri: http://notification-service:8087
          predicates:
            - Path=/notification-api-docs/**
          filters:
            - RewritePath=/notification-api-docs/(?<segment>.*), /$\{segment}

        - id: audit-swagger
          uri: http://audit-service:8088
          predicates:
            - Path=/audit-swagger-ui/**
          filters:
            - RewritePath=/audit-swagger-ui/(?<segment>.*), /$\{segment}

        - id: audit-api-docs
          uri: http://audit-service:8088
          predicates:
            - Path=/audit-api-docs/**
          filters:
            - RewritePath=/audit-api-docs/(?<segment>.*), /$\{segment}

        - id: report-swagger
          uri: http://report-service:8089
          predicates:
            - Path=/report-swagger-ui/**
          filters:
            - RewritePath=/report-swagger-ui/(?<segment>.*), /$\{segment}

        - id: report-api-docs
          uri: http://report-service:8089
          predicates:
            - Path=/report-api-docs/**
          filters:
            - RewritePath=/report-api-docs/(?<segment>.*), /$\{segment}

        # Gateway endpoints
        - id: gateway-health
          uri: http://localhost:8082
          predicates:
            - Path=/api/gateway/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "https://myiam.ru"
              - "https://api.myiam.ru"
              - "http://localhost:8082"
            allowedMethods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
            allowedHeaders: "Authorization, Content-Type, X-Requested-With"
            allowCredentials: true
            maxAge: 3600


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
      - url: /asset-api-docs/v3/api-docs
        name: Asset Service
      - url: /user-api-docs/v3/api-docs
        name: User Service
      - url: /task-api-docs/v3/api-docs
        name: Task Service
      - url: /notification-api-docs/v3/api-docs
        name: Notification Service
      - url: /audit-api-docs/v3/api-docs
        name: Audit Service
      - url: /report-api-docs/v3/api-docs
        name: Report Service
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.asset.gateway: INFO
    org.springdoc: WARN