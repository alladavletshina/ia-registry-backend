# Тестовый профиль – изолированное окружение без внешних зависимостей
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Для H2 требуется указать placeholderReplacement=false, чтобы не было конфликта с PostgreSQL-специфичным синтаксисом
    placeholders:
      # Пустой placeholder, чтобы миграции не падали из-за незнакомых выражений
      dummy: ignored

  # Отключаем RabbitMQ для тестов
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Для тестов отключаем проверку JWT (или используем мок)
          issuer-uri: http://localhost:8080/realms/test

# Отключаем синхронизацию с ФСТЭК (она не нужна в тестах)
fstec:
  sync-cron: "-"

# Уровень логирования для тестов – можно уменьшить, чтобы не захламлять вывод
logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    com.example.assetservice: DEBUG
