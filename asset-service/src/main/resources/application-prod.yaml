server:
  port: 8084

spring:
  application:
    name: asset-service
  datasource:
    url: jdbc:postgresql://postgres-assets:5432/assets
    username: assets
    password: assets123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://api.myiam.ru/realms/asset-management
          jwk-set-uri: https://api.myiam.ru/realms/asset-management/protocol/openid-connect/certs

fstec:
  threat-url: https://bdu.fstec.ru/files/documents/thrlist.xlsx
  parser-type: xlsx
  sync-cron: "0 0 3 * * *"
  connection-timeout: 10000
  read-timeout: 30000

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    org.springframework.security: DEBUG
    org.springframework.web: TRACE
    com.example.assetservice.service.fstec: DEBUG
    org.apache.poi: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    default-model-expand-depth: 3
    default-models-expand-depth: 3
    try-it-out-enabled: true
    filter: true